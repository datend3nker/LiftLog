apply plugin: 'com.android.library'

group = 'expo.modules.openlink'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

// OpenLink is a git submodule (../openlink). Its own build needs AGP 9, which cannot share a Gradle
// build with React Native's AGP 8, so its client and contract sources are compiled into this module.
def openlink = file('../openlink')

android {
  namespace "expo.modules.openlink"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    aidl true
  }
  sourceSets {
    main {
      java.srcDirs += ["$openlink/contract/src/main/kotlin", "$openlink/client/src/main/kotlin"]
      aidl.srcDirs += ["$openlink/contract/src/main/aidl"]
    }
  }
  lintOptions {
    abortOnError false
  }
}
